[package]
name         = "todo-client"
version      = "0.1.0"
description  = "Wire format shared by the server, the TUI and the MCP."
authors      = ["wallago <tbd@gmail.com>"]
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/wallago/todo"
edition      = "2024"
rust-version = "1.88"

[features]
# Request functions. The server turns this off: it only needs the types.
default = ["http"]
http    = ["dep:reqwest", "dep:thiserror"]

[dependencies]
chrono    = { version = "0.4", default-features = false, features = ["serde"] }
reqwest   = { version = "0.13.5", default-features = false, features = ["json"], optional = true }
serde     = { version = "1.0.229", features = ["derive"] }
thiserror = { version = "2.0.19", optional = true }
todo-core = { path = "../core" }

[dev-dependencies]
pretty_assertions = "1.4.1"
serde_json        = "1"

[lints]
workspace = true
