[package]
name         = "todo-mcp"
version      = "0.1.0"
description  = "MCP server exposing the todo server's tools."
authors      = ["wallago <tbd@gmail.com>"]
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/wallago/todo"
edition      = "2024"
rust-version = "1.88"

[dependencies]
axum               = "0.8.9"
clap               = { version = "4.6.6", features = ["derive", "env", "wrap_help"] }
rmcp               = { version = "3.7.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars           = "1"
serde              = { version = "1.0.229", features = ["derive"] }
serde_json         = "1"
todo-client        = { path = "../client", features = ["schemars"] }
tokio              = { version = "1.52.3", features = ["full"] }
tracing            = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
pretty_assertions = "1.4.1"

[lints]
workspace = true
