[server]
address = "127.0.0.1"
port = 3000
# File holding the bearer token for /api and /mcp, relative to this file.
# Unset: no auth, anyone who can reach the server can use them.
# token_file = "token"
# Read-only token for GET /api/agenda (phone widgets), also accepted as ?token=.
# Needs token_file. Use a different value: it ends up in URLs.
# read_token_file = "read-token"

[vault]
# Relative to this file.
root = "../../vault/"
# Note that new todos go to, relative to root.
inbox = "todo.md"

[mcp]
# `Host` headers accepted on /mcp. Add your public hostname to serve remote clients.
allowed_hosts = ["localhost", "127.0.0.1", "::1"]
