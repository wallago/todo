<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#191a1b">
  <title>Todo</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <nav>
      <a href="#/" data-page="due">Due</a>
      <a href="#/notes" data-page="notes">Notes</a>
    </nav>
    <span id="status" aria-live="polite"></span>
    <button id="sync" type="button" title="Sync now" aria-label="Sync now">⟳</button>
    <button id="settings" type="button" title="Settings" aria-label="Settings">⚙</button>
  </header>
  <main id="main"></main>
  <button id="add" type="button" aria-label="Add a todo">+</button>

  <dialog id="form-dialog">
    <form id="form" method="dialog">
      <h2 id="form-title">Add</h2>
      <label>What
        <input name="text" required autocomplete="off">
      </label>
      <label>Note
        <input name="note" list="note-list" required autocomplete="off" autocapitalize="none">
      </label>
      <datalist id="note-list"></datalist>
      <div class="row">
        <label>Due
          <input name="due" type="date">
        </label>
        <label>Priority
          <select name="priority">
            <option value="highest">highest</option>
            <option value="high">high</option>
            <option value="medium">medium</option>
            <option value="normal" selected>normal</option>
            <option value="low">low</option>
            <option value="lowest">lowest</option>
          </select>
        </label>
      </div>
      <div class="row">
        <label>Repeat
          <select name="recur">
            <option value="">never</option>
            <option value="day">every day</option>
            <option value="week">every week</option>
            <option value="month">every month</option>
            <option value="year">every year</option>
          </select>
        </label>
        <label>Status
          <select name="status">
            <option value="todo">todo</option>
            <option value="in_progress">in progress</option>
            <option value="done">done</option>
            <option value="cancelled">cancelled</option>
          </select>
        </label>
      </div>
      <label>Tags
        <input name="tags" placeholder="home, errands" autocomplete="off" autocapitalize="none">
      </label>
      <label class="check"><input name="pinned" type="checkbox"> Pinned</label>
      <div class="buttons">
        <button id="delete" type="button" class="danger">Delete</button>
        <span class="grow"></span>
        <button value="cancel" formnovalidate>Cancel</button>
        <button value="save" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="token-dialog">
    <form id="token-form" method="dialog">
      <h2>Server token</h2>
      <p>The bearer token from the server's <code>token_file</code>. Stays on this device.</p>
      <input name="token" type="password" autocomplete="off">
      <div class="buttons">
        <button id="reset" type="button" class="danger">Forget local copy</button>
        <span class="grow"></span>
        <button value="cancel" formnovalidate>Cancel</button>
        <button value="save" class="primary">Save</button>
      </div>
    </form>
  </dialog>
</body>
</html>
