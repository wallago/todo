[package]
name = "todo-server"
version = "0.1.0"
description = "Server todo app."
authors = ["wallago <tbd@gmail.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/wallago/server"
edition = "2024"
rust-version = "1.88"

[dependencies]
better-panic = "0.3.0"
clap = { version = "4.6.6", features = ["derive", "env", "wrap_help", "cargo"] }
dirs = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
axum = "0.8.9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rmcp = { version = "3.7.0", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1"
serde_json = "1"
todo-client = { path = "../client", default-features = false, features = ["schemars"] }
todo-core = { path = "../core" }
todo-md = { path = "../md" }
todo-store = { path = "../store" }


[dev-dependencies]
pretty_assertions = "1.4.1"
rstest = "0.26"
tempfile = "3"
todo-client = { path = "../client" }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
