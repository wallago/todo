[package]
name         = "todo-store"
version      = "0.1.0"
description  = "Owns the todo database (SQLite): notes, todos, and the one-time vault import."
authors      = ["wallago <tbd@gmail.com>"]
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/wallago/todo"
edition      = "2024"
rust-version = "1.88"

[dependencies]
chrono     = { version = "0.4", default-features = false, features = ["clock"] }
rusqlite   = { version = "0.37", features = ["bundled", "chrono"] }
serde      = "1"
serde_json = "1"
thiserror  = "2.0.19"
todo-core  = { path = "../core" }
todo-md    = { path = "../md" }
uuid       = { version = "1", features = ["v5", "v7"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile          = "3"

[lints]
workspace = true
