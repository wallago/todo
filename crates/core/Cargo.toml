[package]
name         = "todo-core"
version      = "0.1.0"
description  = "Core todo model: plain data, no I/O."
authors      = ["wallago <tbd@gmail.com>"]
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/wallago/todo"
edition      = "2024"
rust-version = "1.88"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde"] }
serde  = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
serde_json        = "1"

[lints]
workspace = true
