[package]
name = "todo"
version = "0.1.0"
description = "Just a personal Todo app."
authors = ["wallago <tbd@gmail.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/wallago/todo"
keywords = []
categories = []
edition = "2024"
rust-version = "1.88"

[workspace]
members = ["crates/*"]

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false
panic = "abort"
lto = true
codegen-units = 1
strip = true

[profile.bench]
opt-level = 3
debug = false

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
missing_docs_in_private_items = "warn"

[lints]
workspace = true
