[workspace]
members  = ["apps/server", "apps/tui", "crates/*"]
resolver = "3"

[profile.dev]
debug     = true
opt-level = 0

[profile.test]
debug     = true
opt-level = 0

[profile.release]
codegen-units = 1
debug         = false
lto           = true
opt-level     = 3
panic         = "abort"
strip         = true

[profile.bench]
debug     = false
opt-level = 3

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs                  = "warn"
unreachable_pub               = "warn"
unused_qualifications         = "warn"

[workspace.lints.clippy]
dbg_macro                     = "warn"
expect_used                   = "warn"
missing_docs_in_private_items = "warn"
panic                         = "warn"
pedantic                      = { level = "warn", priority = -1 }
print_stdout                  = "warn"
todo                          = "warn"
unwrap_used                   = "warn"
