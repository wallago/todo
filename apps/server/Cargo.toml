[package]
name         = "todo-server"
version      = "0.1.0"
description  = "Server todo app."
authors      = ["wallago <tbd@gmail.com>"]
license      = "MIT OR Apache-2.0"
readme       = "README.md"
repository   = "https://github.com/wallago/server"
edition      = "2024"
rust-version = "1.88"

[dependencies]
axum               = "0.8.9"
base64             = "0.22"
better-panic       = "0.3.0"
chrono             = { version = "0.4", default-features = false, features = ["clock"] }
clap               = { version = "4.6.6", features = ["derive", "env", "wrap_help", "cargo"] }
dirs               = "6.0.0"
form_urlencoded    = "1.2"
hmac               = "0.12"
rmcp               = { version = "3.7.0", features = ["server", "macros", "transport-streamable-http-server"] }
schemars           = "1"
serde              = { version = "1.0.229", features = ["derive"] }
serde_json         = "1"
sha2               = "0.10"
subtle             = "2.6"
thiserror          = "2.0.19"
todo-client        = { path = "../../crates/client", default-features = false, features = ["schemars"] }
todo-core          = { path = "../../crates/core" }
todo-store         = { path = "../../crates/store" }
tokio              = { version = "1.52.3", features = ["full"] }
toml               = "1.1.4"
tower-http         = { version = "0.6", features = ["fs", "set-header"] }
tracing            = "0.1.44"
tracing-subscriber = "0.3.23"
uuid               = "1"


[dev-dependencies]
pretty_assertions = "1.4.1"
rstest            = "0.26"
tempfile          = "3"
todo-client       = { path = "../../crates/client" }
tower             = { version = "0.5", features = ["util"] }

[lints]
workspace = true
